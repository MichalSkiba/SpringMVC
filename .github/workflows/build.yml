name: Java 21 WAR build
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B --no-transfer-progress clean package
      - run: python3 -c "import xml.etree.ElementTree as e; [e.parse(p) for p in ('src/main/webapp/WEB-INF/web.xml','src/main/webapp/WEB-INF/spring/webcontext/security-context.xml','src/main/webapp/WEB-INF/spring/webcontext/DispatcherServlet-context.xml')]"
